buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// UDP 4.1.7 declara el paquete en el manifiesto; AGP actual exige namespace.
// La adaptación queda en nuestro proyecto, sin editar node_modules.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        if (subproject.name == "react-native-udp") {
            subproject.android.namespace = "com.tradle.react"
        }
    }
}
