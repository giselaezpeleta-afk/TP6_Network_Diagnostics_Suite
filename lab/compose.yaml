name: tp6-network-lab
services:
  equipo:
    build: .
    # Inicialmente solo escucha en la PC. El acceso desde Android se habilita
    # después de identificar la IP LAN y comprobar el firewall de Windows.
    ports:
      - "${LAB_BIND_IP:-127.0.0.1}:2222:22/tcp"
      - "${LAB_BIND_IP:-127.0.0.1}:1161:161/udp"
    volumes:
      - ../.tools/lab/authorized_keys:/run/tp6/authorized_keys:ro
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "snmpget", "-v2c", "-c", "tp6-lab-readonly", "-t", "2", "-r", "0", "127.0.0.1", "1.3.6.1.2.1.1.5.0"]
      interval: 15s
      timeout: 5s
      retries: 3
