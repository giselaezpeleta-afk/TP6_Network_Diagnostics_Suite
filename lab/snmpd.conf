# Community pública exclusiva del laboratorio: solo lectura, sin operaciones SET.
# SNMP v2c no cifra el tráfico; no usar esta configuración en producción.
agentAddress udp:161
rocommunity tp6-lab-readonly
sysName TP6-Lab
sysLocation Laboratorio local en contenedor
sysContact Tecnico TP6
# Se consultan sysName, sysUpTime e interfaces del contenedor, no del router.
